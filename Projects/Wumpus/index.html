<style>
/* Layout: cueva a la izquierda, mochila y controles a la derecha; en teléfono se apila. Look único: cueva de noche a la luz de una antorcha. */
:root{
  color-scheme: dark;
  --rock:#1a1511;
  --rock-2:#241d17;
  --rock-3:#2f261e;
  --line:#3d3228;
  --text:#efe4d2;
  --muted:#a8977f;
  --torch:#e8a33d;
  --wind:#d3d4cc;
  --smell:#b5b04e;
  --glow:#f4cf5a;
  --danger:#e06650;
  --safe:#7fbf8a;
  --f-display:"Cinzel", "Times New Roman", serif;
  --f-body:"Alegreya Sans", "Trebuchet MS", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--rock);color:var(--text)}
img{max-width:100%}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.05;margin:0;color:var(--torch);letter-spacing:.04em;text-shadow:0 2px 12px rgba(232,163,61,.25)}
.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
.levels{display:flex;flex-wrap:wrap;gap:6px}
.levels button,.btn{font:inherit;font-size:.92rem;font-weight:500;color:var(--text);background:var(--rock-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--torch);color:#22180c;border-color:var(--torch)}
.btn:hover,.levels button:hover{border-color:var(--torch)}
.btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line)}
.btn.on{background:var(--torch);color:#22180c;border-color:var(--torch)}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.game{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.game{grid-template-columns:minmax(0,1fr)}}

.boardbox{position:relative;width:100%;max-width:560px}
.board{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:1px;padding:10px;width:100%;border-radius:14px;
  background:#050403;box-shadow:inset 0 0 0 1px #221b15,inset 0 0 40px #000,0 14px 34px rgba(0,0,0,.55)}
.light,.light2{position:absolute;inset:0;border-radius:14px;pointer-events:none;z-index:4}
.light{mix-blend-mode:multiply}
.light2{mix-blend-mode:screen}
.cell{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:2px;background-color:#2a2420;background-size:230%;background-blend-mode:multiply;padding:0;cursor:default;font:inherit;color:var(--text);overflow:hidden;box-shadow:inset 0 0 12px rgba(0,0,0,.7)}
.cell.notable{cursor:pointer}
.cell.seen{background-color:#a39382}
.cell.mem{background-color:#6c5e52}
.cell.hint{background-color:#4c4036;box-shadow:inset 0 0 0 1px rgba(232,163,61,.18),inset 0 0 14px rgba(0,0,0,.8)}
.cell.here{background-color:#e4cba8;box-shadow:inset 0 0 0 1.5px rgba(232,163,61,.55),inset 0 0 16px rgba(0,0,0,.45)}
.cell.entry .door{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fx,.obj{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.obj{z-index:2}
.wum.dead{filter:grayscale(.9) brightness(.55)}
.cell.hint .fx{opacity:.6}
.cell.mem .fx{opacity:.45}
.chips{position:absolute;top:3px;left:3px;display:flex;gap:2px;z-index:3}
.chip{width:clamp(8px,2vw,11px);height:clamp(8px,2vw,11px);border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.65)}
.chip.v{background:var(--wind)} .chip.o{background:var(--smell)} .chip.r{background:var(--glow)}
.hunter{position:absolute;inset:0;z-index:5}
.hunter.dead{filter:grayscale(1) brightness(.55)}
@media (prefers-reduced-motion:no-preference){
  .gust path{animation:gust 3.2s linear infinite}
  .gust path:nth-child(2){animation-delay:-1.1s;animation-duration:3.8s}
  .gust path:nth-child(3){animation-delay:-2.1s;animation-duration:2.9s}
  @keyframes gust{0%{transform:translateX(-22px);opacity:0}35%,65%{opacity:1}100%{transform:translateX(22px);opacity:0}}
  .dust circle{animation:dust 1.6s linear infinite}
  .dust circle:nth-child(2n){animation-duration:2.1s;animation-delay:-.7s}
  .dust circle:nth-child(3n){animation-duration:1.3s;animation-delay:-1.1s}
  @keyframes dust{0%{transform:translateX(-30px);opacity:0}20%,80%{opacity:.9}100%{transform:translate(42px,-4px);opacity:0}}
  .puff{transform-box:fill-box;transform-origin:center;animation:puff 4.5s ease-in-out infinite}
  .puff:nth-child(2){animation-delay:-1.5s}.puff:nth-child(3){animation-delay:-3s}
  @keyframes puff{0%{transform:translateY(14px) scale(.7);opacity:0}40%{opacity:1}100%{transform:translateY(-18px) scale(1.25);opacity:0}}
  .fly{transform-box:view-box;animation:fly 1.4s linear infinite}
  .fly:nth-of-type(2){animation-duration:1.9s;animation-direction:reverse}
  .fly:nth-of-type(3){animation-duration:1.1s}
  @keyframes fly{to{transform:rotate(360deg)}}
  .fx-glow .bloom{animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.65}}
  .mote{animation:mote 5s ease-in-out infinite}
  .mote:nth-child(2n){animation-duration:6.5s;animation-delay:-2s}
  .mote:nth-child(3n){animation-delay:-3.7s}
  @keyframes mote{0%{transform:translate(0,6px);opacity:0}30%{opacity:1}100%{transform:translate(5px,-26px);opacity:0}}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate}
  @keyframes flick{to{transform:scale(1.06,.93) skewX(-3deg)}}
  .glint{transform-box:fill-box;transform-origin:center;animation:glint 2.6s ease-in-out infinite}
  .glint:nth-child(2){animation-delay:-.9s}.glint:nth-child(3){animation-delay:-1.8s}
  @keyframes glint{0%,70%,100%{opacity:0;transform:scale(.3)}80%{opacity:1;transform:scale(1)}}
  .wum .eyes{animation:blink 5s infinite}
  @keyframes blink{0%,95%,100%{opacity:1}97%{opacity:0}}
  .light2{animation:torch 1.8s ease-in-out infinite}
  @keyframes torch{0%,100%{opacity:1}30%{opacity:.8}55%{opacity:.95}75%{opacity:.76}}
  .cell.mem .fx *{animation:none}
}
.legendcell{position:relative;display:inline-block;width:38px;height:38px;border-radius:3px;background-color:#a39382;background-size:230%;background-blend-mode:multiply;overflow:hidden;flex:none}
.note{position:absolute;right:3px;bottom:2px;font-weight:700;font-size:clamp(.6rem,2vw,.85rem);z-index:2}
.note.p{color:var(--wind)} .note.w{color:var(--danger)} .note.t{color:var(--glow)} .note.s{color:var(--safe)}
.blindcover{position:absolute;inset:0;border-radius:10px;background:#050403;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);z-index:5}
.blindcover strong{display:block;font-family:var(--f-display);font-weight:700;font-size:1.5rem;color:var(--danger)}
.over{position:absolute;inset:auto 8px 8px 8px;z-index:6;background:rgba(15,12,9,.94);border:1px solid var(--torch);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.over p{margin:0;font-weight:500}
.over .big{font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--torch);display:block}

.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--rock-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.stat span{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.pad button{font-size:1.3rem}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
.pad .c{grid-column:2;grid-row:2;display:grid;place-items:center;font-size:.7rem;color:var(--muted);text-align:center;line-height:1.1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.aim{font-size:.88rem;color:var(--torch);min-height:1.3em;margin:0}
h2{font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.03em;margin:0 0 6px;color:var(--text)}
.notes{display:flex;flex-wrap:wrap;gap:6px}
.notes .btn{font-size:.85rem;padding:5px 9px}
.timers{display:flex;flex-direction:column;gap:5px}
.tbar{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.tbar i{display:block;height:8px;border-radius:4px;background:var(--rock-3);overflow:hidden}
.tbar i b{display:block;height:100%;width:0;background:var(--danger)}
.log{list-style:none;margin:0;padding:0;max-height:220px;overflow-y:auto;border-top:1px solid var(--line)}
.log li{padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.log li:first-child{color:var(--text);font-weight:500}
.log li:not(:first-child){color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.88rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
details{background:var(--rock-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details li{margin:3px 0}
@media (prefers-reduced-motion:no-preference){.cell{transition:background .25s}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>La cueva del Wumpus</h1>
      <p class="sub">Entrá, encontrá el oro y volvé a la entrada con vida.</p>
    </div>
    <div class="levels" id="levels" role="group" aria-label="Nivel"></div>
  </header>

  <div class="game">
    <div class="boardbox" id="boardbox">
      <div class="board" id="board" role="grid" aria-label="Cueva"></div>
    </div>

    <div class="panel">
      <div class="stats">
        <div class="stat"><span>Flechas</span><b id="sArrows">3</b></div>
        <div class="stat"><span>Oro</span><b id="sGold">No</b></div>
        <div class="stat"><span>Pasos</span><b id="sMoves">0</b></div>
        <div class="stat"><span>Antorcha</span><b id="sTorch">Sí</b></div>
      </div>

      <div class="controls">
        <div class="pad">
          <button class="btn u" data-dir="u" aria-label="Arriba">↑</button>
          <button class="btn l" data-dir="l" aria-label="Izquierda">←</button>
          <div class="c" id="padLabel">mover</div>
          <button class="btn r" data-dir="r" aria-label="Derecha">→</button>
          <button class="btn d" data-dir="d" aria-label="Abajo">↓</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
          <div class="actions">
            <button class="btn" id="bArrow">Disparar flecha</button>
            <button class="btn" id="bSword">Usar espada</button>
            <button class="btn" id="bGrab">Agarrar oro</button>
            <button class="btn" id="bExit">Salir de la cueva</button>
          </div>
          <p class="aim" id="aim"></p>
        </div>
      </div>

      <div id="notesBox">
        <h2>Notas</h2>
        <div class="notes" id="notes">
          <button class="btn" data-note="p">Posible pozo</button>
          <button class="btn" data-note="w">Posible Wumpus</button>
          <button class="btn" data-note="t">Posible oro</button>
          <button class="btn" data-note="s">Segura</button>
          <button class="btn" data-note="x">Borrar</button>
        </div>
      </div>

      <div id="timersBox" hidden>
        <h2>Peligro por quedarte quieto</h2>
        <div class="timers">
          <div class="tbar"><span>Sueño (olor)</span><i><b id="tO"></b></i></div>
          <div class="tbar"><span>Viento</span><i><b id="tV"></b></i></div>
          <div class="tbar"><span>Ceguera</span><i><b id="tR"></b></i></div>
        </div>
      </div>

      <div>
        <h2>Lo que sentís</h2>
        <ul class="log" id="log" aria-live="polite"></ul>
      </div>

      <div class="legend">
        <span id="lgV"></span>
        <span id="lgO"></span>
        <span id="lgR"></span>
      </div>

      <details id="rules">
        <summary>Reglas de este nivel</summary>
        <ul id="rulesList"></ul>
      </details>
      <button class="btn" id="bNew">Nueva cueva</button>
    </div>
  </div>
</div>

<script>

function makeRock(seed, S = 128, tint = [150, 138, 122], base = [60, 52, 44], k = S/128){

    });

    const i = (py*S+px)*4;
    for(let ch=0; ch<3; ch++) d[i+ch] = Math.max(0, Math.min(255, tint[ch]*v + base[ch]));

    const line = (ox, oy) => { x.beginPath(); pts.forEach(([a,b],j) => j ? x.lineTo(a+ox,b+oy) : x.moveTo(a+ox,b+oy)); };
    line(.7,.7); x.strokeStyle = 'rgba(255,236,205,.07)'; x.lineWidth = U/220; x.stroke();

  }
  for(let q=0; q<Math.round(10*f*f); q++){
    const px = rnd()*S, py = rnd()*S, r = U/130 + rnd()*U/36;
    const gr = x.createRadialGradient(px-r*.3, py-r*.4, 0, px, py, r);

  }

}

    + '<ellipse cx="74.6" cy="41.6" rx="3.2" ry="2.8" fill="url(#gSkin)"/>'
    + (lit ? flame : smoke)
    + '</svg>';
}

let levelId = 'facil';
let G = null;

const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const key = (x,y) => x+','+y;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const inB = (x,y) => x>=0 && y>=0 && x<G.n && y<G.n;
function neigh(x,y,n){return Object.values(DIRS).map(([dx,dy])=>[x+dx,y+dy]).filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n)}

function generate(cfg){
  for(let t=0;t<8000;t++){
    const o = cfg.opts[Math.floor(Math.random()*cfg.opts.length)];
    const n = o.n, np = rnd(...o.pits), nw = rnd(...o.wum);
    const ent = {x:0, y:n-1};
    const free = [];
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){
      if(Math.abs(x-ent.x)+Math.abs(y-ent.y) > 1) free.push([x,y]);
    }
    if(free.length < np+nw+1) continue;
    shuffle(free);
    const [gx,gy] = free.pop();
    const pits = new Set();
    for(let i=0;i<np;i++){const [x,y]=free.pop(); pits.add(key(x,y));}
    const wum = [];
    for(let i=0;i<nw;i++){const [x,y]=free.pop(); wum.push({x,y,alive:true});}
    const wumSet = new Set(wum.map(w=>key(w.x,w.y)));
    // combinaciones de percepciones
    let ok = true;
    for(let y=0;y<n && ok;y++)for(let x=0;x<n;x++){
      const k = key(x,y);
      if(pits.has(k) || wumSet.has(k)) continue;
      let v=0,s=0,r=0;
      for(const [a,b] of neigh(x,y,n)){
        const kk = key(a,b);
        if(pits.has(kk)) v=1;
        if(wumSet.has(kk)) s=1;
        if(a===gx && b===gy) r=1;
      }
      if(v+s+r > cfg.maxTypes){ok=false;break}
    }
    if(!ok) continue;
    // camino garantizado entrada → oro
    const seen = new Set([key(ent.x,ent.y)]);
    const q = [[ent.x,ent.y]];
    let found = false;
    while(q.length){
      const [x,y] = q.shift();
      if(x===gx && y===gy){found=true;break}
      for(const [a,b] of neigh(x,y,n)){
        const kk = key(a,b);
        if(seen.has(kk) || pits.has(kk) || wumSet.has(kk)) continue;
        seen.add(kk); q.push([a,b]);
      }
    }
    if(!found) continue;
    return {n, ent, pits, wum, gold:{x:gx,y:gy,taken:false}};
  }
  return null;
}

function percepts(x,y){
  let v=false,o=false,r=false;
  for(const [a,b] of neigh(x,y,G.n)){
    if(G.pits.has(key(a,b))) v=true;
    if(G.wum.some(w=>w.alive && w.x===a && w.y===b)) o=true;
    if(!G.gold.taken && G.gold.x===a && G.gold.y===b) r=true;
  }
  return {v,o,r};
}
const wumAt = (x,y) => G.wum.find(w=>w.alive && w.x===x && w.y===y);

function newGame(){
  const cfg = LEVELS[levelId];
  const g = generate(cfg);
  G = Object.assign(g, {
    cfg, hx:g.ent.x, hy:g.ent.y, hasGold:false, arrows:3, moves:0,
    alive:true, over:null, blind:!!cfg.dark, step:null, aim:null, noteMode:null,
    visited:new Set(), mem:{}, notes:{}, timer:{o:0,v:0,r:0}, log:[]
  });
  G.visited.add(key(G.hx,G.hy));
  say('Estás en la entrada de la cueva. Está oscuro y húmedo.');
  sense();
  setupLevelUI();
  render();
}

function say(msg){ G.log.unshift(msg); if(G.log.length>40) G.log.pop(); }

function sense(){
  const p = percepts(G.hx,G.hy);
  const goldHere = !G.gold.taken && G.gold.x===G.hx && G.gold.y===G.hy;
  G.mem[key(G.hx,G.hy)] = {...p, gold:goldHere};
  const parts = [];
  if(p.v) parts.push('sentís viento');
  if(p.o) parts.push('huele muy mal');
  if(p.r) parts.push(G.blind ? 'sentís calor de un resplandor' : 'ves un resplandor');
  if(goldHere) parts.push(G.blind ? '¡tocás el oro con la mano!' : '¡el oro está acá!');
  if(G.moves>0 && G.hx===G.ent.x && G.hy===G.ent.y) parts.push('sentís aire fresco: estás en la entrada');
  const pre = (G.blind && G.step) ? 'Diste un paso '+({u:'hacia arriba',d:'hacia abajo',l:'hacia la izquierda',r:'hacia la derecha'})[G.step]+'. ' : '';
  G.step = null;
  if(parts.length) say(pre + cap(parts.join(', ')) + '.');
  else if(G.moves>0) say(pre + 'Nada raro por acá. Casilla tranquila.');
}
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

function die(msg){ G.alive=false; G.over={win:false,msg}; say(msg); }

function wumpusTurn(){
  if(!G.cfg.wmove || G.over) return;
  for(const w of G.wum){
    if(!w.alive || Math.random() > G.cfg.prob) continue;
    const opts = neigh(w.x,w.y,G.n).filter(([a,b])=>{
      if(a===G.hx && b===G.hy) return false;           // nunca entra en la casilla del cazador
      if(wumAt(a,b)) return false;
      if(G.cfg.wmove==='avoid' && G.pits.has(key(a,b))) return false;
      return true;
    });
    if(!opts.length) continue;
    const [a,b] = opts[Math.floor(Math.random()*opts.length)];
    w.x=a; w.y=b;
    if(G.pits.has(key(a,b))){ w.alive=false; say('Escuchás un aullido que se aleja hacia abajo: un Wumpus cayó en un pozo.'); }
  }
}

function move(dir){
  if(G.over) return;
  if(G.aim){ return fire(dir); }
  const [dx,dy] = DIRS[dir];
  const nx=G.hx+dx, ny=G.hy+dy;
  if(!inB(nx,ny)){ say('Chocás contra la pared de roca.'); return render(); }
  G.hx=nx; G.hy=ny; G.moves++; G.step=dir;
  G.timer = {o:0,v:0,r:G.blind?0:0};
  G.visited.add(key(nx,ny));
  if(G.pits.has(key(nx,ny))) { die('Caíste en un pozo.'); return render(); }
  if(wumAt(nx,ny)) { die('Entraste en la casilla del Wumpus y te comió.'); return render(); }
  wumpusTurn();
  sense();
  render();
}

function fire(dir){
  const kind = G.aim; G.aim=null;
  const [dx,dy] = DIRS[dir];
  if(kind==='arrow'){
    if(G.arrows<=0) return render();
    G.arrows--;
    let x=G.hx+dx, y=G.hy+dy, hit=null;
    while(inB(x,y)){ const w=wumAt(x,y); if(w){hit=w;break} x+=dx; y+=dy; }
    if(hit){ hit.alive=false; say('Disparaste '+DIRNAME[dir]+'. Se oye un grito horrible: mataste un Wumpus.'); }
    else say('Disparaste '+DIRNAME[dir]+'. La flecha se pierde en la oscuridad.');
  } else {
    const x=G.hx+dx, y=G.hy+dy;
    const w = inB(x,y) && wumAt(x,y);
    if(!w) say('Lanzás un golpe de espada '+DIRNAME[dir]+'. Solo cortás el aire.');
    else if(Math.random() < G.cfg.sword){ w.alive=false; say('¡Espadazo certero! El Wumpus cae muerto.'); }
    else { die('Fallaste el espadazo y el Wumpus te devoró.'); return render(); }
  }
  wumpusTurn();
  sense();
  render();
}

function setAim(kind){
  if(G.over) return;
  if(kind==='arrow' && G.arrows<=0) return;
  G.aim = G.aim===kind ? null : kind;
  render();
}

function grab(){
  if(G.over) return;
  if(!G.gold.taken && G.gold.x===G.hx && G.gold.y===G.hy){
    G.gold.taken=true; G.hasGold=true; G.timer.r=0;
    say('Agarraste el oro. Ahora volvé a la entrada.');
    wumpusTurn(); sense();
  } else say('Acá no hay nada para agarrar.');
  render();
}

function exitCave(){
  if(G.over) return;
  if(G.hx!==G.ent.x || G.hy!==G.ent.y){ say('Solo podés salir desde la entrada.'); return render(); }
  if(G.hasGold){ G.over={win:true,msg:'Saliste con el oro en '+G.moves+' pasos. ¡Ganaste!'}; say(G.over.msg); }
  else { G.over={win:false,msg:'Saliste sano y salvo, pero sin el oro. No ganaste esta vez.'}; say(G.over.msg); }
  render();
}

// Trampas por tiempo (Muy difícil)
let last = performance.now();
setInterval(()=>{
  const now = performance.now(), dt = Math.min((now-last)/1000, .5); last = now;
  if(!G || G.over || !G.cfg.timers || document.hidden) return;
  const p = percepts(G.hx,G.hy);
  G.timer.o = p.o ? G.timer.o+dt : 0;
  G.timer.v = p.v ? G.timer.v+dt : 0;
  G.timer.r = (p.r && !G.blind) ? G.timer.r+dt : 0;
  if(G.timer.o >= LIMITS.o){ die('El olor te durmió y el Wumpus te encontró.'); return render(); }
  if(G.timer.v >= LIMITS.v){ die('El viento te arrastró al pozo.'); return render(); }
  if(G.timer.r >= LIMITS.r){ G.blind=true; G.timer.r=0; say('El resplandor te dejó ciego. La antorcha se apagó: guiate por lo que sentís.'); render(); }
  drawTimers();
}, 100);

function drawLight(){
  const el = $('light'); if(!el) return;
  const el2 = $('light2');
  if(G.over || G.cfg.vision==='all' || G.blind){ el.style.background = (G.blind && !G.over) ? '#000' : 'none'; el2.style.background='none'; return; }
  const b = $('board'), pad = 10, cs = (b.clientWidth - pad*2) / G.n;
  const cx = pad + cs*(G.hx+.5), cy = pad + cs*(G.hy+.5);
  const r1 = cs*(G.cfg.vision==='cross'?1.4:.9), r2 = cs*(G.cfg.vision==='cross'?2.6:1.9);
  el.style.background = 'radial-gradient(circle at '+cx+'px '+cy+'px, #fff 0, #fff '+r1+'px, #5e4c3c '+r2+'px, #2a221b '+(r2+cs*2)+'px)';
  el2.style.background = 'radial-gradient(circle at '+(cx+cs*.25)+'px '+(cy-cs*.25)+'px, rgba(255,150,60,.2) 0, rgba(255,120,40,.07) '+r2+'px, transparent '+(r2+cs)+'px)';
}
window.addEventListener('resize', ()=>G && drawLight());
function drawTimers(){
  if(!G.cfg.timers) return;
  $('tO').style.width = Math.min(100, G.timer.o/LIMITS.o*100)+'%';
  $('tV').style.width = Math.min(100, G.timer.v/LIMITS.v*100)+'%';
  $('tR').style.width = Math.min(100, G.timer.r/LIMITS.r*100)+'%';
}

function setupLevelUI(){
  $('notesBox').hidden = !G.cfg.notes;
  $('timersBox').hidden = !G.cfg.timers;
  document.querySelectorAll('#levels button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lv===levelId));
  const c = G.cfg, R = [];
  R.push('Cueva de '+G.n+'×'+G.n+', con '+G.pits.size+(G.pits.size===1?' pozo':' pozos')+' y '+G.wum.length+(G.wum.length===1?' Wumpus':' Wumpus')+'.');
  R.push(c.vision==='none' ? 'No ves nada: ni la cueva ni al cazador. Te guían solo los mensajes de lo que sentís.' : c.vision==='all' ? 'Ves toda la cueva.' : c.vision==='cross' ? 'Ves tu casilla y la antorcha te muestra las señales de las 4 casillas vecinas.' : 'Solo ves la casilla donde estás parado.');
  R.push(c.maxTypes===1 ? 'Cada casilla tiene como máximo una señal.' : 'Una casilla puede tener '+(c.maxTypes===2?'hasta 2 señales':'varias señales')+' a la vez.');
  R.push(!c.wmove ? 'El Wumpus no se mueve.' : c.wmove==='fall' ? 'El Wumpus se mueve y puede caer en un pozo.' : 'El Wumpus se mueve y esquiva los pozos.');
  R.push('Nunca entra en tu casilla sin avisar: antes vas a sentir olor.');
  R.push('3 flechas: viajan en línea recta hasta la pared. Espada: golpea la casilla de al lado'+(c.sword<1?' y falla la mitad de las veces (si falla, te come).':'.'));
  if(c.timers) R.push('Quieto mucho tiempo: '+LIMITS.o+' s con olor te dormís, '+LIMITS.v+' s con viento te arrastra al pozo'+(c.dark?'.':', '+LIMITS.r+' s con resplandor quedás ciego.'));
  $('tR').closest('.tbar').hidden = !!c.dark;
  if(c.notes) R.push('Podés marcar casillas con notas, como en el buscaminas.');
  R.push('Teclado: flechas o WASD para moverte, F flecha, E espada, G agarrar, X salir.');
  $('rulesList').innerHTML = R.map(r=>'<li>'+r+'</li>').join('');
}

function chipsHTML(p){
  let fx = (p.r?SVG.glow:'') + (p.v?SVG.wind:'') + (p.o?SVG.smell:'');
  const dots = (p.v?'<i class="chip v" title="viento"></i>':'')+(p.o?'<i class="chip o" title="olor"></i>':'')+(p.r?'<i class="chip r" title="resplandor"></i>':'');
  return fx + (dots?'<div class="chips">'+dots+'</div>':'');
}

function render(){
  const b = $('board');
  b.style.setProperty('--n', G.n);
  const full = !!G.over || G.cfg.vision==='all';
  let html = '';
  for(let y=0;y<G.n;y++)for(let x=0;x<G.n;x++){
    const k = key(x,y), here = x===G.hx && y===G.hy;
    const isEnt = x===G.ent.x && y===G.ent.y;
    let cls = 'cell', inner = '';
    const adj = Math.abs(x-G.hx)+Math.abs(y-G.hy)===1;
    if(full){
      cls += here ? ' here' : ' seen';
      inner += chipsHTML(percepts(x,y));
      if(G.pits.has(k)) inner += SVG.pit;
      const w = G.wum.find(w=>w.x===x&&w.y===y);
      if(w && !(G.pits.has(k) && !w.alive)) inner += wumpusSVG(!w.alive);
      if(!G.gold.taken && G.gold.x===x && G.gold.y===y) inner += SVG.gold;
    } else if(here){
      cls += ' here';
      inner += chipsHTML(percepts(x,y));
      if(!G.gold.taken && G.gold.x===x && G.gold.y===y) inner += SVG.gold;
      const w = G.wum.find(w=>!w.alive && w.x===x && w.y===y);
      if(w) inner += wumpusSVG(true);
    } else if(G.cfg.vision==='cross' && adj){
      cls += ' hint';
      inner += chipsHTML(percepts(x,y));
    } else if(G.visited.has(k)){
      cls += ' mem';
      const m = G.mem[k];
      if(m){ inner += chipsHTML(m); if(m.gold && !G.gold.taken) inner += SVG.gold; }
    }
    if(isEnt){ cls += ' entry'; inner = SVG.door + inner; }
    if(here) inner += '<div class="hunter'+(G.alive?'':' dead')+'">'+hunterSVG({gold:G.hasGold, blind:G.blind})+'</div>';
    const n = G.notes[k];
    if(n && !here && !G.over) inner += '<span class="note '+n+'">'+({p:'P?',w:'W?',t:'O?',s:'✓'}[n])+'</span>';
    if(G.cfg.notes && G.noteMode) cls += ' notable';
    const rk = rockStyle(x,y); cls += rk.cls;
    html += '<button class="'+cls+'" style="background-position:'+rk.pos+'" data-k="'+k+'" role="gridcell" aria-label="Fila '+(y+1)+', columna '+(x+1)+(here?', estás acá':'')+'" tabindex="-1">'+inner+'</button>';
  }
  b.innerHTML = html + '<div class="light" id="light"></div><div class="light2" id="light2"></div>';
  drawLight();

  const box = $('boardbox');
  box.querySelectorAll('.blindcover,.over').forEach(e=>e.remove());
  if(G.blind && !G.over){
    box.insertAdjacentHTML('beforeend',(G.cfg.dark ? '<div class="blindcover"><div><strong>Oscuridad total</strong>No ves nada. Guiate solo por lo que sentís (abajo): el viento, el olor, el resplandor y los golpes contra la pared. Empezás en la entrada, abajo a la izquierda.</div></div>' : '<div class="blindcover"><div><strong>Ciego</strong>La antorcha se apagó. Usá lo que sentís (abajo) para volver a la entrada.</div></div>'));
  }
  if(G.over){
    box.insertAdjacentHTML('beforeend','<div class="over"><p><span class="big">'+(G.over.win?'¡Victoria!':(G.alive?'Fin de la partida':'Moriste'))+'</span>'+G.over.msg+'</p><button class="btn on" id="bAgain">Otra cueva</button></div>');
    $('bAgain').onclick = newGame;
  }

  $('sArrows').textContent = G.arrows;
  $('sGold').textContent = G.hasGold ? 'Sí' : 'No';
  $('sMoves').textContent = G.moves;
  $('sTorch').textContent = G.cfg.dark ? 'No hay' : G.blind ? 'Apagada' : 'Encendida';
  $('bArrow').classList.toggle('on', G.aim==='arrow');
  $('bSword').classList.toggle('on', G.aim==='sword');
  $('bArrow').disabled = !!G.over || G.arrows<=0;
  $('bSword').disabled = !!G.over;
  $('bGrab').disabled = !!G.over;
  $('bExit').disabled = !!G.over;
  $('bArrow').textContent = 'Disparar flecha ('+G.arrows+')';
  $('padLabel').textContent = G.aim==='arrow' ? 'disparar' : G.aim==='sword' ? 'golpear' : 'mover';
  $('aim').textContent = G.aim ? 'Elegí una dirección para '+(G.aim==='arrow'?'disparar':'el espadazo')+'. Esc para cancelar.' : '';
  document.querySelectorAll('#notes button').forEach(bt=>bt.classList.toggle('on', bt.dataset.note===G.noteMode));
  $('log').innerHTML = G.log.map(l=>'<li>'+l+'</li>').join('');
  drawTimers();
}

// Eventos
Object.entries(LEVELS).forEach(([id,cfg])=>{
  const bt = document.createElement('button');
  bt.textContent = cfg.name; bt.dataset.lv = id; bt.type='button';
  bt.onclick = ()=>{ levelId=id; newGame(); };
  $('levels').appendChild(bt);
});
document.querySelectorAll('.pad button').forEach(bt=>bt.onclick=()=>move(bt.dataset.dir));
$('bArrow').onclick = ()=>setAim('arrow');
$('bSword').onclick = ()=>setAim('sword');
$('bGrab').onclick = grab;
$('bExit').onclick = exitCave;
$('bNew').onclick = newGame;
$('notes').onclick = e=>{
  const bt = e.target.closest('button'); if(!bt) return;
  G.noteMode = G.noteMode===bt.dataset.note ? null : bt.dataset.note; render();
};
$('board').onclick = e=>{
  const c = e.target.closest('.cell'); if(!c || !G.cfg.notes || !G.noteMode || G.over) return;
  const k = c.dataset.k;
  if(G.noteMode==='x' || G.notes[k]===G.noteMode) delete G.notes[k]; else G.notes[k]=G.noteMode;
  render();
};
document.addEventListener('keydown', e=>{
  if(!G) return;
  const m = {ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'}[e.key];
  if(m){ e.preventDefault(); return move(m); }
  const k = e.key.toLowerCase();
  if(k==='f') setAim('arrow');
  else if(k==='e') setAim('sword');
  else if(k==='g') grab();
  else if(k==='x') exitCave();
  else if(e.key==='Escape'){ G.aim=null; G.noteMode=null; render(); }
});

initArt();
$('lgV').innerHTML = '<i class="legendcell rk1">'+SVG.wind+'</i> viento: pozo al lado';
$('lgO').innerHTML = '<i class="legendcell rk1">'+SVG.smell+'</i> olor: Wumpus al lado';
$('lgR').innerHTML = '<i class="legendcell rk1">'+SVG.glow+'</i> resplandor: oro al lado';
newGame();
</script>
</body>
