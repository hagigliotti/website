<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gestione Ordini Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Smokum&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<style>
/* Replica del gestionale: tema chiaro unico (come l'originale). Testata scura #2c3e50, fondo #eef1f4, pannelli bianchi arrotondati. */
:root{
  --ink:#2c3e50; --ink2:#1a252f; --bg:#eef1f4; --panel:#fff; --line:#e2e5e8; --muted:#8a94a0; --blue:#5396ed; --blue2:#2f6f9f;
  --orange:#d97732; --green:#3f8b70; --rb:#8f5a94; --red:#e63946; --stim:#c76a00;
  --title:"Smokum","Rockwell Extra Bold","Arial Black",Impact,serif; --font:Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:#222;font-family:var(--font);font-size:14px;overflow-x:hidden}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.scroller{overflow-x:auto;min-height:100%}
.app{min-width:1420px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* barra del simulatore */
.simbar{background:#101820;color:#cfd8e1;font-size:12px}
.simbar .gut{display:flex;align-items:center;gap:14px;padding-block:6px;flex-wrap:wrap}
.simbar .fake{background:#f5c542;color:#2b2100;font-weight:700;padding:2px 8px;border-radius:3px;letter-spacing:.06em}
.simbar a{color:#cfd8e1;text-decoration:none;opacity:.8}
.simbar a:hover,.simbar a.on{opacity:1;color:#fff;text-decoration:underline}
.simbar .sp{flex:1}
.simbar .pill{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:10px}
.simbar button{background:transparent;border:1px solid #4a5a6a;color:#cfd8e1;border-radius:4px;padding:1px 8px;cursor:pointer}
.chiptest{cursor:pointer;border-radius:10px;padding:2px 8px;font-weight:700}
.chiptest.ok{background:#1f5f3f;color:#d6f5e4}.chiptest.ko{background:#7a1f1f;color:#ffdede}
/* titolo pagine */
h2.ptitle{font-family:var(--title);text-transform:uppercase;font-size:56px;line-height:1;margin:0;text-align:center;letter-spacing:.02em;font-weight:400;color:#000;padding:14px 0 10px;border-bottom:3px solid var(--ink);margin-bottom:18px}
.page{max-width:1800px;margin:0 auto;padding:0 16px 60px}
/* pannelli */
fieldset{margin:0;min-width:0}
.panel-box{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(44,62,80,.08);padding:10px}
.panel-box>legend{color:var(--ink);font-size:17px;font-weight:700;letter-spacing:.3px;padding:0 6px;text-transform:uppercase}
.panel-box>legend svg{color:var(--blue);margin-right:6px}
.sub{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.sub>legend{font-weight:700;font-size:13px;color:var(--ink);padding:0 4px}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=email],select,textarea{width:100%;border:1.5px solid #d5dbe2;border-radius:6px;padding:6px 8px;background:#fff;color:#222}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(83,150,237,.18);outline:none}
input:disabled,select:disabled{background:#dde2e7;color:#6b7580;cursor:not-allowed}
input.bad{border-color:var(--red);background:#fdecea}
.hl-clear{outline:2px dashed var(--red)!important;outline-offset:2px}
/* bottoni */
.menu-btn{width:100%;height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;font-weight:700;text-transform:uppercase;text-align:left;line-height:1.05;color:#fff;background:linear-gradient(180deg,#2c3e50,#1a252f);border:1px solid #101820;border-radius:10px;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}
.menu-btn svg{color:#9db4cc;min-width:18px;font-size:16px}
.menu-btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.28)} .menu-btn:hover svg{color:#fff}
.menu-btn.btn-red:hover{background:#811628}.menu-btn.btn-purple:hover{background:#504375}.menu-btn.btn-blue:hover{background:#21759b}.menu-btn.btn-darkblue:hover{background:#2b579a}.menu-btn.btn-green:hover{background:#217346}.menu-btn.btn-orange:hover{background:#f69a0b}.menu-btn.btn-home:hover{background:#d7621a}.menu-btn.btn-bordo:hover{background:#3b0a12}.menu-btn.btn-teal:hover{background:#12877a}
.sbtn{font-size:14px;padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:600;color:#fff;background:linear-gradient(180deg,#3a5570,#2c3e50);box-shadow:0 2px 6px rgba(44,62,80,.25);transition:transform .15s,filter .15s}
.sbtn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.sbtn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.sbtn.blue{background:linear-gradient(180deg,#6ba6ec,#5396ed)}
.sbtn.red{background:linear-gradient(180deg,#d9534f,#b8352f)}
.sbtn.green{background:linear-gradient(180deg,#4a9d7f,#3f8b70)}
.sbtn.reset{background:#fff;color:#5c6975;border:1px solid #e6989f;box-shadow:none;font-weight:500;text-transform:uppercase}
.sbtn.reset:hover{background:#fdecea;border-color:var(--red);color:var(--red);filter:none;transform:none}
.sbtn.sm{padding:5px 12px;font-size:12.5px}
.nav-btn{width:34px;height:34px;border:none;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.2);border:2px solid #2c3e50}
.nav-btn:hover{background:#3f7fd1}.nav-btn:disabled{background:#e9ecef;color:#aaa;border-color:#ccc;cursor:not-allowed;box-shadow:none}
.nav-btn.dark{background:#2c3e50}
.floatbtns{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;z-index:40}
.floatbtns button{width:46px;height:46px;border-radius:50%;border:none;color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(44,62,80,.35)}
.floatbtns .up{background:linear-gradient(180deg,#3a5570,#2c3e50)}.floatbtns .dn{background:linear-gradient(180deg,#6ba6ec,#5396ed)}
.back{display:block;width:220px;margin:30px auto 0;background:#d9d3ea;border:none;padding:10px;font-size:17px;cursor:pointer;border-radius:3px}
.back:hover{background:#c8bfe3}
/* tabella principale */
.tabwrap{overflow:auto}
table{border-collapse:collapse}
#tabOrdiniCliente{width:100%;font-size:12px;box-shadow:0 2px 10px rgba(44,62,80,.08)}
#tabOrdiniCliente th{background:linear-gradient(180deg,#2c3e50,#1a252f);color:#fff;position:sticky;top:0;z-index:5;padding:8px;font-size:12px;border:1px solid #ddd;cursor:pointer;line-height:1.2}
#tabOrdiniCliente th.b{color:#82baff}#tabOrdiniCliente th.a{color:#ffc682}
#tabOrdiniCliente td{border:1px solid #ddd;padding:8px;text-align:center;vertical-align:middle;line-height:1.9}
#tabOrdiniCliente td.l{text-align:left;max-width:25ch}
#tabOrdiniCliente tbody tr:nth-child(odd){background:#fff}#tabOrdiniCliente tbody tr:nth-child(even){background:#f4f6f8}#tabOrdiniCliente tbody tr:hover{background:#e5f0fc}
#tabOrdiniCliente tr.evid{font-weight:700}#tabOrdiniCliente tr.evid:nth-child(odd) td{background:#ffe0b3}#tabOrdiniCliente tr.evid:nth-child(even) td{background:#fff0d9}#tabOrdiniCliente tr.evid:hover td{background:#ffd28f}
#tabOrdiniCliente tr.spian td{color:#c62828}
#tabOrdiniCliente tr.flash td{background:#fff59d!important}
a.lnk,.lnk{color:var(--blue);text-decoration:none;cursor:pointer;background:none;border:none;padding:0;font:inherit}
a.lnk:hover,.lnk:hover{text-decoration:underline}
.ico-act{color:#7d5fc4;cursor:pointer;margin:0 3px;background:none;border:none;padding:0}
.ico-act:hover{color:#2c3e50}
.resline{font-size:13px;margin:10px 0 40px;font-weight:700}
.resline .warn{color:var(--red);font-weight:400}
.nores{max-width:480px;margin:24px auto;text-align:center;color:#64748b}
.nores svg{display:block;margin:0 auto 10px;font-size:28px;color:#b8c2cc}
/* modali */
.mb{position:fixed;inset:0;background:rgba(20,25,32,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;max-height:90vh;width:780px;max-width:100%}
.mhead{background:linear-gradient(180deg,#2c3e50,#1a252f);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px}
.mhead h3{margin:0;font-size:17px;flex:1;display:flex;gap:8px;align-items:center}
.mclose{background:rgba(255,255,255,.12);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer}
.mclose:hover{background:rgba(255,255,255,.28)}
.mbody{padding:18px 22px;overflow:auto;font-size:13.5px;line-height:1.5;color:#2c333c}
.mfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center;background:#f7f9fa}
.acc{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.acc summary{background:#f4f6f8;padding:10px 14px;font-weight:700;cursor:pointer;color:var(--ink);list-style:none;display:flex;gap:8px;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::before{content:"▸";color:var(--blue);transition:transform .15s}
.acc[open] summary::before{transform:rotate(90deg)}
.acc summary svg{color:var(--blue)}
.acc .ab{padding:12px 16px}
.toc{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 18px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.toc a{display:flex;gap:8px;align-items:center;color:#4a545e;text-decoration:none;font-weight:600;font-size:13px;padding:6px 4px;border-radius:6px;cursor:pointer}
.toc a:hover{background:#f4f6f8}.toc svg{color:var(--blue)}
.nota{background:#f4f6f8;border-left:4px solid #8a94a0;border-radius:4px;padding:8px 12px;margin:8px 0;font-size:12.5px}
.att{background:#fff6e8;border-left:4px solid #c98a3d;border-radius:4px;padding:8px 12px;margin:8px 0;font-size:12.5px}
.err{color:var(--red);font-size:12px;min-height:0}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:120;align-items:center}
.toast{background:#1a252f;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3);border-left:4px solid var(--blue);max-width:520px}
.toast.ko{border-left-color:var(--red)}.toast.ok{border-left-color:#3fbf7f}
/* tabelle scure generiche */
.dt{border-collapse:collapse;width:100%}
.dt th{background:linear-gradient(180deg,#2c3e50,#1a252f);color:#fff;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;border:1px solid #ddd;position:sticky;top:0;z-index:2}
.dt th.sort{cursor:pointer}
.dt td{border:1px solid #ddd;padding:4px 8px;font-size:13px;text-align:center}
.dt tbody tr:nth-child(even) td{background:#f7f9fb}
.dt tbody tr:hover td{background:#e3f0fe}
.dt tr.hl td{background:#d7ebff!important}
/* calendario */
.cal-menu{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cal-menu .menu-btn{width:180px;height:50px;font-size:13.5px}
.cal-row{display:flex;gap:16px;align-items:stretch;margin-top:14px}
.cal-row>*{min-width:0}
table.cal{border-collapse:collapse;background:#fff;border:2px solid #2c3e50}
table.cal th{background:#000;color:#fff;padding:5px;border:1px solid #000;font-size:15px}
table.cal th.s{font-size:10px;padding:2px;border-left:2px solid #000;border-right:2px solid #000}
table.cal td{width:43px;height:43px;border:1px solid #000;text-align:center;font-size:16px;line-height:1.05}
table.cal td.wk{width:34px;background:#a0a0a0;font-size:11px;color:#061d3b;font-weight:700;border-left:2px solid #000;border-right:2px solid #000}
table.cal td.tt{width:40px;background:#a0a0a0;font-size:10px;color:#061d3b;border-left:2px solid #000;border-right:2px solid #000;line-height:1.2}
table.cal td.day{cursor:pointer}
table.cal td.day:hover{filter:brightness(.85)}
table.cal td.sel{background:#5396ed!important;color:#fff!important;font-weight:700}
table.cal small{font-size:11px}
.stim{color:var(--stim);font-style:italic}
.mini-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}
.mini{border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18);background:#a0a0a0;border:2px solid transparent}
.mini.cur{border-color:#000}
.mini .mt{background:linear-gradient(180deg,#2c3e50,#1a252f);color:#fff;font-weight:700;font-size:11.5px;text-align:center;padding:3px}
.mini.cur .mt{background:#000}
.mini table{width:100%;border-collapse:collapse;font-size:10px}
.mini th{background:#2c3e50;color:#fff;font-weight:700;padding:1px;font-size:9px}
.mini td{text-align:center;padding:2px 0;border:1px solid #8c8c8c;background:#fff;cursor:pointer}
.mini td.o{background:#a0a0a0;color:#555;cursor:default}
.mini td.w{color:#e63946}
.mini td.has{background:#6c8aa3;color:#fff}
.mini td.has.w{color:#ffd0d4}
.mini td.today{background:#5396ed;color:#fff;font-weight:700}
.mini td:not(.o):hover{filter:brightness(.85)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sl{width:38px;height:20px;border-radius:10px;background:#cfd5db;position:relative;transition:background .15s;flex:none}
.switch .sl::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.switch input:checked+.sl{background:#d93a2f}
.switch input:checked+.sl::after{left:20px}
.switch input:focus-visible+.sl{outline:2px solid var(--blue)}
.srch{display:flex;align-items:center;gap:6px;border:1px solid #d5dbe2;border-radius:20px;padding:4px 12px;background:#fff;flex:1}
.srch input{border:none;padding:4px;box-shadow:none}
.srch input:focus{box-shadow:none}
.srch svg{color:#8a94a0}
.srch .x{border:none;background:none;color:#8a94a0;cursor:pointer;font-size:16px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700}
.tag.auto{background:#e3f0fe;color:#1a5fa8}.tag.man{background:#fff0d9;color:#a85d00}
.ia{border:none;background:transparent;color:#8a94a0;cursor:pointer;font-size:12px;padding:2px 4px}
.ia:hover{color:#2c3e50}.ia.del:hover{color:var(--red)}
.fic{font-size:18px;cursor:pointer}
.info-l{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.info-l svg{color:var(--blue);width:14px}
/* pervenuti */
.pv{--ink:#243746;--pm:#71808d;--pl:#dfe5e9;color:#243746;font-size:13px}
.pv-head{display:flex;align-items:center;gap:14px;padding:18px 0 10px}
.pv-head h1{margin:0;font-size:22px;letter-spacing:.4px;display:flex;gap:8px;align-items:center}
.pv-head h1 small{color:var(--blue2);font-size:inherit}
.pv-head .smallm{color:#71808d;font-size:11px;font-weight:400;letter-spacing:0}
.pnav{display:flex;gap:6px;align-items:center;margin-left:auto}
.pnav button,.pnav select{border:1px solid #b8c5cd;border-radius:5px;padding:6px 10px;background:#fff;color:#243746;cursor:pointer;font-size:13px;width:auto}
.pnav button:hover{background:#eaf3f9}.pnav button:disabled{opacity:.4;cursor:not-allowed}
.pnav .vista{display:flex}.pnav .vista button{border-radius:0}.pnav .vista button:first-child{border-radius:5px 0 0 5px}.pnav .vista button:last-child{border-radius:0 5px 5px 0}
.pnav .vista button.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}
.pnav button.mod.on{background:var(--orange);border-color:var(--orange);color:#fff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.card{background:#fff;border:1px solid #dfe5e9;border-radius:8px;padding:12px 16px;box-shadow:0 1px 3px rgba(31,45,55,.08)}
.card .cl{color:#71808d;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
.card .cv{display:block;margin-top:6px;font-size:24px;font-weight:700;color:var(--blue2)}
.card .cn{display:block;color:#71808d;font-size:11px;margin-top:4px}
.su{color:var(--green)!important}.giu{color:#c0392b!important}
.sblock{background:#fff;border:1px solid #dfe5e9;border-radius:8px;padding:10px;margin-bottom:12px;box-shadow:0 1px 3px rgba(31,45,55,.06)}
.foglio{width:100%;border-collapse:collapse;table-layout:fixed}
.foglio th,.foglio td{border:1px solid #dfe5e9;padding:5px 4px;text-align:center}
.foglio thead th{color:#fff;font-size:11px;font-weight:700}
.foglio thead th.c-rb{background:var(--rb)}.foglio thead th.c-estero{background:var(--orange)}.foglio thead th.c-italia{background:var(--green)}
.foglio thead th.can{letter-spacing:2px;font-size:11.5px}
.foglio thead th.ang{background:#2c3e50;width:140px;font-size:13px;white-space:nowrap}
.foglio thead th.ang small{display:inline;font-size:10px;font-weight:400;opacity:.75;margin:0 2px}
.foglio thead th.lato{background:#2c3e50;width:140px}
.foglio thead th small{display:block;font-weight:400;opacity:.8;font-size:9.5px}
.foglio td.c-rb{background:#fcf9fc}.foglio td.c-estero{background:#fffaf5}.foglio td.c-italia{background:#f8fbf9}
.foglio td.ini,.foglio th.ini{border-left:2px solid #b8c5cd}
.foglio td.num{font-size:14px;font-weight:700}
.foglio th.ng{text-align:left;font-weight:700;padding-left:8px;background:#fff;display:table-cell}
.foglio th.ng .d{float:right;color:#71808d;font-size:11px;font-weight:400}
.foglio tr.fut th.ng{color:#b0b8be;background:repeating-linear-gradient(135deg,#f6f8f9 0 6px,#fff 6px 12px)}
.foglio tr.out th.ng,.foglio tr.out td{opacity:.35}
.foglio tr.oggi th.ng{box-shadow:inset 4px 0 0 var(--orange)}
.foglio tr.fest th.ng{color:#c0392b}
.foglio tr.tot td,.foglio tr.tot th{background:#eef1f4;font-weight:700;font-size:15px;padding:9px 4px}
.foglio tr.tot th{text-align:right;font-size:12px;padding-right:8px}
.modifica .foglio tr.giorno:not(.fut):hover td.num,.modifica .foglio tr.giorno:not(.fut):hover th.ng{background:#eaf3f9;cursor:pointer}
td.lt{background:#fbfcfd;font-size:12px}
td.lt small{display:block;color:#71808d;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
td.lt span{display:block;line-height:1.6}
td.lt.fut{background:repeating-linear-gradient(135deg,#f3f5f7 0 6px,#fbfcfd 6px 12px);color:#a7b0b8}
td.bozza{background:#fff6b3!important}
td.tot .dl{display:block;font-size:10px;font-weight:700}
.legenda{display:flex;gap:16px;flex-wrap:wrap;color:#71808d;font-size:11px;margin-top:6px}
.legenda svg{margin-right:3px}
.pin-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 10px}
.pin-grid label{font-size:11px;font-weight:700;color:#243746;display:flex;flex-direction:column;gap:2px}
.pin-grid label small{font-weight:400;color:#71808d}
.pin-grid input{text-align:center;font-size:17px;font-weight:700;padding:6px}
.pin-sec{border:1px solid #dfe5e9;border-radius:8px;padding:12px;margin:0 0 12px;position:relative}
.pin-sec>legend{color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:1px}
.pin-tot{text-align:right;color:#71808d;font-size:11px;margin-top:6px}
/* statistiche */
.st-head{display:flex;align-items:flex-end;gap:16px;padding:18px 0 10px}

let SNBUF = "";
document.addEventListener("keydown", e => {
  const tg = (e.target.tagName || "").toLowerCase(); if (["input", "select", "textarea"].includes(tg) || !/^[a-z]$/i.test(e.key)) return;
  SNBUF = (SNBUF + e.key.toLowerCase()).slice(-5); if (SNBUF === "snake") { SNBUF = ""; snake(); }
});
function snake() {
  const m = modal({ title: "Snake", icon: "fa-gamepad", width: 440, body: `<canvas id="snc" width="400" height="300" style="background:#101820;border-radius:6px;display:block;margin:auto"></canvas><p style="text-align:center;margin:8px 0 0">Frecce per muoversi · Punti: <b id="snp">0</b></p>` });
  const c = $("#snc", m).getContext("2d"), S = 20; let sn = [{ x: 5, y: 5 }], dir = { x: 1, y: 0 }, food = { x: 12, y: 8 }, pts = 0;
  const key = e => { const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key]; if (k && (k[0] !== -dir.x || k[1] !== -dir.y)) { dir = { x: k[0], y: k[1] }; e.preventDefault(); } };
  document.addEventListener("keydown", key);
  const t = setInterval(() => {
    const h = { x: (sn[0].x + dir.x + 20) % 20, y: (sn[0].y + dir.y + 15) % 15 };
    if (sn.some(p => p.x === h.x && p.y === h.y)) { clearInterval(t); c.fillStyle = "#fff"; c.font = "20px Arial"; c.fillText("Game over · " + pts, 130, 150); return; }
    sn.unshift(h); if (h.x === food.x && h.y === food.y) { pts++; $("#snp", m).textContent = pts; food = { x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 15) }; } else sn.pop();
    c.fillStyle = "#101820"; c.fillRect(0, 0, 400, 300); c.fillStyle = "#f69a0b"; c.fillRect(food.x * S, food.y * S, S - 2, S - 2); c.fillStyle = "#5396ed"; sn.forEach(p => c.fillRect(p.x * S, p.y * S, S - 2, S - 2));
  }, 120);
  m._onClose = () => { clearInterval(t); document.removeEventListener("keydown", key); };
}
